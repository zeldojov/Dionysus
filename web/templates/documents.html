<!doctype html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dionysus Documents</title>
    <link rel="stylesheet" href="/static/documents.css">
</head>

<body>
    <main class="documents-page">
        <header class="documents-header">
            <div>
                <p class="eyebrow">Dionysus</p>
                <h1>Your documents</h1>
            </div>
            <button id="new-document" class="new-document" type="button">New document</button>
        </header>
        <p id="documents-status" class="documents-status" role="status">Loading documents</p>
        <section id="documents-list" class="documents-list" aria-label="Documents"></section>
    </main>
    <script src="/static/documents.js" defer></script>
</body>

</html>
