<!doctype html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dionysus Editor</title>
    <script>
        if (localStorage.getItem("dionysus:sidebarShown") === "false") {
            document.documentElement.classList.add("sidebar-hidden");
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/editor.css">
</head>

<body>
    <aside id="editor-sidebar" class="editor-sidebar" aria-label="Editor sidebar">
        <div class="sidebar-header">
            <span class="sidebar-brand">D</span>
            <span class="sidebar-heading">Workspace</span>
        </div>
        <nav class="sidebar-tabs" aria-label="Sidebar sections">
            <button class="sidebar-tab is-active" type="button" data-sidebar-tab="files" aria-selected="true">
                <span class="material-symbols-outlined" aria-hidden="true">folder</span>
                <span>Files</span>
            </button>
            <button class="sidebar-tab" type="button" data-sidebar-tab="history" aria-selected="false">
                <span class="material-symbols-outlined" aria-hidden="true">history</span>
                <span>History</span>
            </button>
        </nav>
        <section id="sidebar-files" class="sidebar-panel" data-sidebar-panel="files" aria-label="Files">
            <div class="sidebar-panel-heading">Documents</div>
            <input id="sidebar-files-filter" class="sidebar-files-filter" type="search" aria-label="Filter documents"
                placeholder="Filter documents">
            <div id="sidebar-files-list" class="sidebar-list" role="list"></div>
        </section>
        <section id="sidebar-history" class="sidebar-panel" data-sidebar-panel="history" aria-label="History" hidden>
            <div class="sidebar-panel-heading">Recent changes</div>
            <div id="sidebar-history-list" class="sidebar-list" role="list"></div>
        </section>
        <div id="sidebar-resize-handle" class="sidebar-resize-handle" role="separator" aria-orientation="vertical"
            aria-label="Resize sidebar" tabindex="0"></div>
    </aside>
    <main class="workspace">
        <header class="topbar">
            <div class="brand-mark" aria-hidden="true">D</div>
            <div>
                <p class="eyebrow">Dionysus</p>
                <input id="document-title" class="document-title" type="text" value="Untitled document"
                    aria-label="Document title">
            </div>
            <a class="documents-link" href="/" aria-label="Back to all documents">
                <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                Back
            </a>
            <div class="editor-actions" aria-label="History">
                <button id="undo" class="history-button" type="button" aria-label="Undo" title="Undo"><span
                        class="material-symbols-outlined" aria-hidden="true">undo</span></button>
                <button id="redo" class="history-button" type="button" aria-label="Redo" title="Redo"><span
                        class="material-symbols-outlined" aria-hidden="true">redo</span></button>
            </div>
        </header>

        <section class="editor-shell" aria-label="Document editor">
            <div class="document-meta">
                <span id="document-revision">Revision 0</span>
                <span class="meta-dot" aria-hidden="true"></span>
                <span>Paragraph mode</span>
            </div>
            <div class="editor" id="editor" spellcheck="false"></div>
            <div class="status-bar">
                <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Collapse sidebar"
                    title="Collapse sidebar" aria-expanded="true">
                    <span class="material-symbols-outlined" aria-hidden="true">left_panel_close</span>
                </button>
                <div class="limit-meters" aria-label="Document limits">
                    <div class="limit-meter" data-limit-level="safe">
                        <span id="document-size-limit" class="limit-meter-label">Size 0 B / 1 MB · 0%</span>
                        <span class="limit-meter-track"><span class="limit-meter-fill"></span></span>
                    </div>
                    <div class="limit-meter" data-limit-level="safe">
                        <span id="document-block-limit" class="limit-meter-label">Blocks 0 / 10,000 · 0%</span>
                        <span class="limit-meter-track"><span class="limit-meter-fill"></span></span>
                    </div>
                </div>
                <div class="save-state" id="save-state" role="status">Loading</div>
            </div>
        </section>
    </main>
    <div id="selection-toolbar" class="selection-toolbar" role="toolbar" aria-label="Text formatting" hidden>
        <button type="button" data-format="bold" aria-label="Bold" title="Bold"><span class="material-symbols-outlined"
                aria-hidden="true">format_bold</span></button>
        <button type="button" data-format="italic" aria-label="Italic" title="Italic"><span
                class="material-symbols-outlined" aria-hidden="true">format_italic</span></button>
        <button type="button" data-format="underline" aria-label="Underline" title="Underline"><span
                class="material-symbols-outlined" aria-hidden="true">format_underlined</span></button>
        <button type="button" data-format="strike" aria-label="Strikethrough" title="Strikethrough"><span
                class="material-symbols-outlined" aria-hidden="true">strikethrough_s</span></button>
        <button type="button" data-format="highlight" aria-label="Highlight" title="Highlight"><span
                class="material-symbols-outlined" aria-hidden="true">highlight</span></button>
        <button type="button" data-format="subscript" aria-label="Subscript" title="Subscript"><span
                class="material-symbols-outlined" aria-hidden="true">subscript</span></button>
        <button type="button" data-format="superscript" aria-label="Superscript" title="Superscript"><span
                class="material-symbols-outlined" aria-hidden="true">superscript</span></button>
        <button type="button" data-format="clear" aria-label="Clear formatting" title="Clear formatting">
            <span class="material-symbols-outlined" aria-hidden="true">format_clear</span>
        </button>
        <span class="selection-toolbar-separator" role="separator" aria-orientation="vertical"></span>
        <div class="caps-menu">
            <button type="button" data-format="caps" aria-label="Change case" aria-haspopup="true" aria-expanded="false"
                title="Change case">
                <span class="material-symbols-outlined" aria-hidden="true">match_case</span>
            </button>
            <div class="caps-options" role="menu" hidden>
                <button type="button" data-caps="upper" role="menuitem" aria-label="Uppercase" title="ALL CAPS">
                    <span class="material-symbols-outlined" aria-hidden="true">uppercase</span>
                </button>
                <button type="button" data-caps="lower" role="menuitem" aria-label="Lowercase" title="all lower">
                    <span class="material-symbols-outlined" aria-hidden="true">lowercase</span>
                </button>
                <button type="button" data-caps="title" role="menuitem" aria-label="Title case" title="Title Case">
                    <span class="material-symbols-outlined" aria-hidden="true">title</span>
                </button>
            </div>
        </div>
        <span class="selection-toolbar-separator" role="separator" aria-orientation="vertical"></span>
        <button type="button" data-format="link" aria-label="Link" title="Link">
            <span class="material-symbols-outlined" aria-hidden="true">link</span>
        </button>
    </div>
    <div id="link-dialog" class="link-dialog" role="dialog" aria-modal="true" aria-labelledby="link-dialog-title"
        hidden>
        <form id="link-dialog-form" class="link-dialog-panel">
            <div class="link-dialog-header">
                <div>
                    <p class="eyebrow">Paragraph link</p>
                    <h2 id="link-dialog-title">Link selected text</h2>
                </div>
                <button id="link-dialog-close" class="link-dialog-close" type="button" aria-label="Close dialog"
                    title="Close dialog"><span class="material-symbols-outlined"
                        aria-hidden="true">close</span></button>
            </div>
            <label class="link-dialog-label" for="link-dialog-input">Paragraph URL</label>
            <input id="link-dialog-input" class="link-dialog-input" type="text" inputmode="url"
                placeholder="/documents/slug#block-id" autocomplete="off" required>
            <label class="link-dialog-reference">
                <input id="link-dialog-reference" type="checkbox">
                <span>Add as reference</span>
            </label>
            <p id="link-dialog-error" class="link-dialog-error" role="alert" hidden>Enter a valid Dionysus paragraph
                link.</p>
            <div class="link-dialog-actions">
                <button id="link-dialog-cancel" class="link-dialog-button link-dialog-button-secondary"
                    type="button">Cancel</button>
                <button class="link-dialog-button link-dialog-button-primary" type="submit">Insert link</button>
            </div>
        </form>
    </div>
    <div id="reference-preview" class="reference-preview" role="tooltip" hidden>
        <span class="reference-preview-label">Referenced paragraph</span>
        <span id="reference-preview-text" class="reference-preview-text"></span>
    </div>
    <script src="/static/editor-transforms.js" defer></script>
    <script src="/static/editor.js" defer></script>
</body>

</html>
